name: Contribution snake

# Draws the contribution graph being eaten by a snake (light + dark,
# in the portfolio's cyan palette) and publishes the SVGs to the
# `output` branch, which README.md embeds.
on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0e7490&color_dots=#ebedf0,#a5f3fc,#67e8f9,#22d3ee,#0891b2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#0f172a,#164e63,#0e7490,#06b6d4,#67e8f9

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # snk runs in a Docker container, so dist/ is owned by root and the
        # runner user cannot `git init` inside it. Publish from a copy instead.
        run: |
          out="$RUNNER_TEMP/snake-output"
          mkdir -p "$out"
          cp dist/*.svg "$out/"
          cd "$out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update contribution snake"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
